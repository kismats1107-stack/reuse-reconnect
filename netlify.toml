# Netlify: build the Vite site and serve dist/. Pages use hash routes (#/lab, #/results),
# so no redirect rules are needed.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
